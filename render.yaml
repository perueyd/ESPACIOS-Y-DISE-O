# Publicación en Render (https://render.com): New → Blueprint → elige este repositorio.
# Los valores secretos (sync: false) se escriben en el panel de Render, nunca aquí.
# Guía paso a paso: docs/PUBLICAR.md
services:
  - type: web
    name: facturador-sunat
    runtime: node
    region: virginia
    # Gratis: se duerme tras 15 min sin visitas, pero la cola de GitHub lo visita cada 5 min.
    # Si el negocio crece, cambiar a "starter" (US$ 7/mes) para que nunca se duerma.
    plan: free
    buildCommand: npm ci
    # Las migraciones se aplican solas al arrancar (cada una una sola vez).
    startCommand: npm run db:migrar && npm run servidor
    healthCheckPath: /v1/salud
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: FIRMA_ALGORITMO
        value: SHA256
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: LLAVE_MAESTRA
        sync: false
      - key: CLAVE_CRON
        sync: false
